<h1 class="page-title">Users</h1>
<mat-form-field class="full" subscriptSizing="dynamic"
  ><mat-label>Search by name or email</mat-label><input matInput [formControl]="q" /><mat-icon
    matSuffix
    >search</mat-icon
  ></mat-form-field
>
<div class="table-wrap gap">
  <table mat-table [dataSource]="data()?.items ?? []">
    <ng-container matColumnDef="name"
      ><th mat-header-cell *matHeaderCellDef>User</th>
      <td mat-cell *matCellDef="let u">
        <b>{{ u.fullName }}</b>
        <div class="muted xs">{{ u.email }}</div>
      </td></ng-container
    >
    <ng-container matColumnDef="joined"
      ><th mat-header-cell *matHeaderCellDef>Joined</th>
      <td mat-cell *matCellDef="let u">{{ u.createdAt | date: 'mediumDate' }}</td></ng-container
    >
    <ng-container matColumnDef="role"
      ><th mat-header-cell *matHeaderCellDef>Role</th>
      <td mat-cell *matCellDef="let u">
        <mat-form-field subscriptSizing="dynamic" class="sel"
          ><mat-select
            [value]="u.role"
            (selectionChange)="update(u, { role: $event.value })"
            [disabled]="isMe(u)"
          >
            <mat-option value="customer">customer</mat-option
            ><mat-option value="admin">admin</mat-option></mat-select
          ></mat-form-field
        >
      </td></ng-container
    >
    <ng-container matColumnDef="status"
      ><th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let u">
        <mat-form-field subscriptSizing="dynamic" class="sel"
          ><mat-select
            [value]="u.status"
            (selectionChange)="update(u, { status: $event.value })"
            [disabled]="isMe(u)"
          >
            @for (s of statuses; track s) {
              <mat-option [value]="s">{{ s }}</mat-option>
            }
          </mat-select></mat-form-field
        >
      </td></ng-container
    >
    <ng-container matColumnDef="actions"
      ><th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let u" class="right">
        @if (!isMe(u)) {
          <button mat-icon-button (click)="remove(u)" aria-label="Delete user">
            <mat-icon>delete_outline</mat-icon>
          </button>
        }
      </td></ng-container
    >
    <tr mat-header-row *matHeaderRowDef="cols"></tr>
    <tr mat-row *matRowDef="let r; columns: cols"></tr>
  </table>
</div>
@if (data(); as d) {
  <mat-paginator
    [length]="d.meta.total"
    [pageSize]="d.meta.limit"
    [pageIndex]="d.meta.page - 1"
    [hidePageSize]="true"
    (page)="load($event.pageIndex + 1)"
  />
}
