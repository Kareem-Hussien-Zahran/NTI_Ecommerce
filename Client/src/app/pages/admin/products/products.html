<div class="row between wrap">
  <h1 class="page-title">Products</h1>
  <a mat-flat-button routerLink="new"><mat-icon>add</mat-icon>New product</a>
</div>
<mat-form-field class="full" subscriptSizing="dynamic"
  ><mat-label>Search products</mat-label><input matInput [formControl]="q" /><mat-icon matSuffix
    >search</mat-icon
  ></mat-form-field
>
<div class="table-wrap gap">
  <table mat-table [dataSource]="data()?.items ?? []">
    <ng-container matColumnDef="name"
      ><th mat-header-cell *matHeaderCellDef>Product</th>
      <td mat-cell *matCellDef="let p">
        <div class="row">
          <img class="th" [src]="p.images[0]" alt="" />
          <div>
            <b>{{ p.name }}</b>
            <div class="muted xs">{{ brand(p) }}</div>
          </div>
        </div>
      </td></ng-container
    >
    <ng-container matColumnDef="price"
      ><th mat-header-cell *matHeaderCellDef>Price</th>
      <td mat-cell *matCellDef="let p">{{ p.price | currency }}</td></ng-container
    >
    <ng-container matColumnDef="stock"
      ><th mat-header-cell *matHeaderCellDef>Stock</th>
      <td mat-cell *matCellDef="let p">{{ p.totalStock }}</td></ng-container
    >
    <ng-container matColumnDef="status"
      ><th mat-header-cell *matHeaderCellDef>Status</th>
      <td mat-cell *matCellDef="let p">
        <span class="status" [class]="p.isActive ? 'active' : 'cancelled'">{{
          p.isActive ? 'active' : 'hidden'
        }}</span>
      </td></ng-container
    >
    <ng-container matColumnDef="actions"
      ><th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let p" class="right">
        <a mat-icon-button [routerLink]="[p._id]" aria-label="Edit"><mat-icon>edit</mat-icon></a>
        <button mat-icon-button (click)="remove(p)" aria-label="Delete">
          <mat-icon>delete_outline</mat-icon>
        </button>
      </td></ng-container
    >
    <tr mat-header-row *matHeaderRowDef="cols"></tr>
    <tr mat-row *matRowDef="let r; columns: cols"></tr>
  </table>
</div>
@if (data(); as d) {
  <mat-paginator
    [length]="d.meta.total"
    [pageSize]="d.meta.limit"
    [pageIndex]="d.meta.page - 1"
    [hidePageSize]="true"
    (page)="load($event.pageIndex + 1)"
  />
}
